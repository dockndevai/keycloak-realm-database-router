# The catalog datasource and every tenant datasource are plain (non-XA) PostgreSQL pools. A request that touches
# two of them (for example an admin call authenticated against master that manages a tenant realm) enlists two
# "last resources" in the Narayana transaction. Narayana refuses that by default; allow it here. Commit is then
# ordered, not atomic, across databases - see README.md, section "Transactions".
quarkus.transaction-manager.unsafe-multiple-last-resources=allow
