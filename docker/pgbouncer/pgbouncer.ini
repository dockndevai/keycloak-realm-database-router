[databases]
keycloak = host=postgres port=5432 dbname=keycloak
kc_alpha = host=postgres port=5432 dbname=kc_alpha
kc_beta  = host=postgres port=5432 dbname=kc_beta
kc_gamma = host=postgres port=5432 dbname=kc_gamma

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = keycloak
stats_users = keycloak

; Keycloak holds one JDBC connection per request transaction, so transaction pooling is safe.
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 25
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 600

; pgjdbc switches to server-side prepared statements after a few executions; PgBouncer >= 1.21 tracks them.
max_prepared_statements = 512

ignore_startup_parameters = extra_float_digits,options
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
